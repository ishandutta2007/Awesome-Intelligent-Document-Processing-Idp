<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.5)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.2)" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(85px); opacity: 0; }
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    @keyframes flow-particle {
      0% { offset-distance: 0%; opacity: 0.1; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0.1; }
    }

    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .scanner-line {
      animation: scan 3s ease-in-out infinite;
    }

    .pulse {
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    .badge-float-1 { animation: float-badge 4s ease-in-out infinite; }
    .badge-float-2 { animation: float-badge 4s ease-in-out infinite 0.8s; }
    .badge-float-3 { animation: float-badge 4s ease-in-out infinite 1.6s; }
    .badge-float-4 { animation: float-badge 4s ease-in-out infinite 2.4s; }
    .badge-float-5 { animation: float-badge 4s ease-in-out infinite 3.2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="120" r="260" fill="url(#glow-cyan)" />
  <circle cx="980" cy="160" r="300" fill="url(#glow-purple)" />

  <!-- Background Isometric Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Visual Pipeline Backdrop Cards (Positioned in lower-middle background) -->
  <!-- Left Card: Raw Unstructured Documents -->
  <g opacity="0.65">
    <rect x="80" y="190" width="180" height="100" rx="10" fill="#131d31" stroke="url(#card-border)" stroke-width="1.2" />
    <text x="100" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">📄 INPUT DATA</text>
    <rect x="100" y="228" width="130" height="6" rx="3" fill="#334155" />
    <rect x="100" y="240" width="95" height="6" rx="3" fill="#334155" />
    <rect x="100" y="252" width="115" height="6" rx="3" fill="#334155" />
    <rect x="100" y="264" width="70" height="6" rx="3" fill="#0284c7" opacity="0.8" />
    <!-- Dynamic Scanning Laser Line -->
    <line x1="95" y1="205" x2="245" y2="205" stroke="#38bdf8" stroke-width="2.5" filter="url(#laser-glow)" class="scanner-line" />
  </g>

  <!-- Middle Connector Stream -->
  <g opacity="0.6" stroke="#4f46e5" stroke-dasharray="4,4" stroke-width="2">
    <path d="M 260 240 L 490 240" />
    <path d="M 710 240 L 940 240" />
  </g>

  <!-- Middle Card: AI & OCR Pipeline Engine -->
  <g opacity="0.75">
    <rect x="490" y="190" width="220" height="100" rx="10" fill="#181938" stroke="#6366f1" stroke-width="1.2" />
    <text x="515" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">🧠 IDP COGNITIVE ENGINE</text>
    <rect x="515" y="228" width="170" height="18" rx="4" fill="#242654" />
    <text x="525" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#c7d2fe">OCR • VLM • LayoutLM • NLP</text>
    <rect x="515" y="253" width="170" height="18" rx="4" fill="#242654" />
    <text x="525" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">Human-in-the-Loop Validation</text>
  </g>

  <!-- Right Card: Structured Schema Output -->
  <g opacity="0.65">
    <rect x="940" y="190" width="180" height="100" rx="10" fill="#131d31" stroke="url(#card-border)" stroke-width="1.2" />
    <text x="960" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">{ } STRUCTURED OUTPUT</text>
    <rect x="960" y="228" width="120" height="6" rx="3" fill="#10b981" opacity="0.8" />
    <rect x="960" y="240" width="140" height="6" rx="3" fill="#334155" />
    <rect x="960" y="252" width="105" height="6" rx="3" fill="#334155" />
    <rect x="960" y="264" width="130" height="6" rx="3" fill="#10b981" opacity="0.6" />
  </g>

  <!-- Dynamic Animated Signal Dots along Connector Paths -->
  <circle cx="340" cy="240" r="4.5" fill="#38bdf8" class="pulse" />
  <circle cx="410" cy="240" r="3.5" fill="#818cf8" class="pulse" style="animation-delay: 0.6s;" />
  <circle cx="790" cy="240" r="4.5" fill="#a855f7" class="pulse" style="animation-delay: 1.2s;" />
  <circle cx="860" cy="240" r="3.5" fill="#34d399" class="pulse" style="animation-delay: 1.8s;" />

  <!-- ================= FOREGROUND HERO TYPOGRAPHY ================= -->
  <!-- Top Badge / Category Pill -->
  <g transform="translate(475, 26)">
    <rect width="250" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#38bdf8" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title (Crisp, High Contrast, Centered in Foreground) -->
  <text x="600" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
    Intelligent Document Processing (IDP)
  </text>

  <!-- Subtitle -->
  <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Enterprise SaaS Platforms • Vision-Language Models • Open-Source Document AI Pipelines
  </text>

  <!-- Tagline -->
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Document Classification ✦ Intelligent Extraction ✦ Layout Analysis ✦ Workflow Automation
  </text>

  <!-- ================= INTERACTIVE / DYNAMIC PILLS (FOOTER) ================= -->
  <g transform="translate(0, 316)">
    <!-- Pill 1: OCR & Layout Analysis -->
    <g class="badge-float-1" transform="translate(60, 0)">
      <rect width="200" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" />
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ OCR &amp; Layout Analysis</text>
    </g>

    <!-- Pill 2: Vision-Language Models -->
    <g class="badge-float-2" transform="translate(280, 0)">
      <rect width="200" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1" />
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🧠 Multimodal VLMs</text>
    </g>

    <!-- Pill 3: Schema Extraction -->
    <g class="badge-float-3" transform="translate(500, 0)">
      <rect width="200" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1" />
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📊 Schema Extraction</text>
    </g>

    <!-- Pill 4: Human-in-the-Loop -->
    <g class="badge-float-4" transform="translate(720, 0)">
      <rect width="200" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1" />
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔄 Human-in-the-Loop</text>
    </g>

    <!-- Pill 5: Top SaaS & Open Source -->
    <g class="badge-float-5" transform="translate(940, 0)">
      <rect width="200" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1" />
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🚀 SaaS &amp; Open Source</text>
    </g>
  </g>
</svg>
